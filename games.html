<script>
(function () {
  const fallbackEl = document.getElementById('apps-fallback');
  let fallbackTimer = null;

  function showFallback(appName) {
    clearTimeout(fallbackTimer);
    fallbackEl.textContent = `${appName}: Ask Dad to add this app! 📱`;
    fallbackTimer = setTimeout(() => {
      fallbackEl.textContent = '';
    }, 4000);
  }

  function tryOpenApp(scheme, appName) {
    let didLeave = false;

    function onVisibilityChange() {
      if (document.hidden) didLeave = true;
    }

    document.addEventListener('visibilitychange', onVisibilityChange);
    window.location.href = scheme;

    setTimeout(() => {
      document.removeEventListener('visibilitychange', onVisibilityChange);
      if (!didLeave) {
        showFallback(appName);
      }
    }, 1800);
  }

  document.querySelectorAll('[data-scheme]').forEach((btn) => {
    btn.addEventListener('click', () => {
      tryOpenApp(btn.dataset.scheme, btn.dataset.name);
    });
  });
})();
</script>
