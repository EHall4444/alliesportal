<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alastair's Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="title" id="title">
      ALASTAIR'S PORTAL<span class="cursor">_</span>
    </h1>
    <p class="subtitle">PLAYER 1 READY</p>
  </header>

  <main>
    <section class="countdown" aria-label="Countdown timers">
      <h2 class="countdown-title">NEXT UP</h2>
      <div class="countdown-next pixel-panel">
        <span class="countdown-next-icon" id="next-icon">🎉</span>
        <span class="countdown-next-name" id="next-name">Loading...</span>
        <div class="countdown-clock">
          <div class="clock-unit"><span class="clock-value" id="next-days">00</span><span class="clock-label">DAYS</span></div>
          <div class="clock-unit"><span class="clock-value" id="next-hours">00</span><span class="clock-label">HRS</span></div>
          <div class="clock-unit"><span class="clock-value" id="next-mins">00</span><span class="clock-label">MIN</span></div>
          <div class="clock-unit"><span class="clock-value" id="next-secs">00</span><span class="clock-label">SEC</span></div>
        </div>
        <p class="countdown-next-detail" id="next-detail"></p>
      </div>

      <h3 class="countdown-subtitle">COMING UP NEXT</h3>
      <ul class="countdown-list" id="upcoming-list"></ul>
    </section>

    <section class="menu-grid" aria-label="Main menu">
      <a href="#" class="menu-btn"><span class="icon">🎮</span><span class="label">Games</span></a>
      <a href="#" class="menu-btn"><span class="icon">📚</span><span class="label">Books &amp; Songs</span></a>
      <a href="#" class="menu-btn"><span class="icon">📸</span><span class="label">Photos &amp; Videos</span></a>
      <a href="#" class="menu-btn"><span class="icon">🧱</span><span class="label">Lego Manuals</span></a>
      <a href="#" class="menu-btn"><span class="icon">🔍</span><span class="label">Safe Search</span></a>
      <a href="#" class="menu-btn"><span class="icon">🗺️</span><span class="label">Places I've Been</span></a>
      <a href="#" class="menu-btn menu-btn--wide"><span class="icon">🧑‍🎨</span><span class="label">Build My Avatar</span></a>
    </section>

    <section class="crew" aria-label="Call your crew">
      <h2 class="crew-title">CALL YOUR CREW</h2>
      <div class="crew-row">
        <a href="#" class="crew-card"><span class="crew-icon">👵</span><span class="crew-name">Grammie</span></a>
        <a href="#" class="crew-card"><span class="crew-icon">👩</span><span class="crew-name">Naimina</span></a>
        <a href="#" class="crew-card"><span class="crew-icon">👩</span><span class="crew-name">Bunda Franny</span></a>
        <a href="#" class="crew-card"><span class="crew-icon">🧒</span><span class="crew-name">Nico</span></a>
        <a href="#" class="crew-card"><span class="crew-icon">👧</span><span class="crew-name">Gia</span></a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-text">ALASTAIR'S WORLD</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
